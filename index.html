<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1440">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Мастерская</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header>
    <h1>✨ Мастерская</h1>
    <button id="installBtn" hidden>Установить</button>
  </header>

  <main>
    <!-- Режим 1: Точки -->
    <section id="dots" class="screen game active">
      <div class="counter">0</div>
      <div class="speedBox">
        <button class="speedDown">−</button>
        <span class="speedLabel">x1</span>
        <button class="speedUp">+</button>
      </div>
      <button class="reset">↺</button>
    </section>

    <!-- Режим 2: Реакция по цветам -->
    <section id="colors" class="screen game">
      <div class="target">Приготовься…</div>
      <div class="counter">0</div>
      <div class="mistakes">Ошибки: 0</div>
      <div class="speedBox">
        <button class="speedDown">−</button>
        <span class="speedLabel">x1</span>
        <button class="speedUp">+</button>
      </div>
      <button class="reset">↺</button>
    </section>

    <!-- Экран: Идеи -->
    <section id="ideas" class="screen">
      <h2>Мои идеи</h2>
      <form id="ideaForm">
        <input id="ideaInput" placeholder="Придумал что-то? Запиши!" autocomplete="off">
        <button>+</button>
      </form>
      <ul id="ideaList"></ul>
    </section>

    <!-- Экран 2: Рисовалка -->
    <section id="draw" class="screen">
      <h2>Рисовалка</h2>
      <div class="palette" id="palette"></div>
      <canvas id="canvas"></canvas>
      <div class="row">
        <button id="clearBtn">Очистить</button>
        <button id="saveBtn">Сохранить картинку</button>
      </div>
    </section>

    <!-- Экран 3: Сюда добавляй своё -->
    <section id="lab" class="screen">
      <h2>Лаборатория</h2>
      <p>Это пустая комната для твоих экспериментов. Открой <code>index.html</code> и <code>app.js</code> и добавь сюда что угодно: игру, калькулятор, музыку…</p>
      <button id="magicBtn" class="big">Нажми меня</button>
      <p id="magicOut"></p>
    </section>
  </main>

  <nav>
    <button data-screen="dots" class="active">🔴<span>Точки</span></button>
    <button data-screen="colors">🌈<span>Цвета</span></button>
    <button data-screen="ideas">💡<span>Идеи</span></button>
    <button data-screen="draw">🎨<span>Рисовать</span></button>
    <button data-screen="lab">🧪<span>Лаба</span></button>
  </nav>

  <script src="app.js?v=7"></script>
</body>
</html>
